# ============================================================
#  PlotCinema 配置文件
#  剧情镜头演出插件 - 通过传送玩家视角实现剧情动画效果
# ============================================================

# 配置文件版本号，请勿手动修改。
# 插件更新后若配置结构发生变化，此值会提升；
# 若你的配置文件版本低于插件期望版本，OP 进服时会收到提示。
version: 3

record:
  # 自动采样模式下，每隔多少 tick 记录一次玩家位置。
  # 1 秒 = 20 tick。数值越小越流畅，但生成的帧数越多、文件越大。
  # 推荐 2 ~ 4。
  interval-ticks: 2

play:
  # 默认帧间过渡时长（tick）。1 秒 = 20 tick。
  # 当某一帧没有单独设置 transition 时，使用此值作为从上一帧平移到该帧的时长。
  # 设为 0 则默认瞬移（需要平滑的帧自己用 /plot transition 单独设）。
  default-transition-ticks: 20

  # 当玩家不在剧情录制所在世界时：
  #   false = 强制把玩家传送到录制世界播放（推荐，镜头不会穿模）
  #   true  = 在当前世界按相对坐标偏移播放（可能穿模、悬空，谨慎开启）
  allow-relative-play: false

  # 是否在 OP 进服时提示"配置文件版本过旧"。
  notify-outdated-config: true

  # 播放期间给玩家的效果，结束后自动还原。
  effects:
    # 播放期间隐身。
    invisibility: true

    # 播放期间攻速归零（防止玩家在剧情中挥动手臂）。
    zero-attack-speed: true

lock:
  # 剧情播放期间是否禁止玩家移动。
  movement: true

  # 剧情播放期间是否强制锁定视角朝向（镜头方向）。
  rotation: true

  # 剧情播放期间是否禁止攻击、交互、破坏/放置方块。
  interact: true

  # 剧情播放期间是否隐藏 HUD（血条、饥饿、经验条）。
  # 注意：1.20 原版 API 无法直接隐藏 HUD，此项目前仅作预留，
  # 实际效果依赖客户端行为，暂不生效。
  hide-hud: true

  # 剧情播放期间是否隐藏其他玩家（避免穿帮）。
  # 注意：此项需要额外发包处理，当前版本暂未实现，保留配置位。
  hide-other-players: false
